# fnox config for revit-vm
#
# Secret VALUES live in macOS keychain (service: "fnox"); this file is just
# the pointer table mapping env-var names → keychain item names. Safe to
# commit. Seed values with `mise run set-token` and let `fnox exec -- <cmd>`
# (wrapped by the mise tasks below) inject them as env vars at run time.

[providers.keychain]
type = "keychain"
service = "fnox"

[secrets]

# Hetzner Cloud API token. Create one at
# https://console.hetzner.cloud → project → Security → API tokens (Read & Write).
# hcloud reads $HCLOUD_TOKEN natively, so no `hcloud context create` step is needed.
HCLOUD_TOKEN= { provider = "keychain", value = "HCLOUD_TOKEN" }
