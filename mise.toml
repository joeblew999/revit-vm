# Root mise.toml. Single task surface for the repo:
#   - workspace tools + env vars
#   - daily-use orchestrators (start / stop / push / pull)
#   - provider-aware dispatchers (vm:up / vm:down / vm:ip / snapshot:*)
#   - per-stage tasks (connect:*, debug:*, files:*, viewer:*, gui:*, ...)
#
# All tasks live here (see CLAUDE.md decision 6 — subfolder mise.toml's were
# tried and rolled back). Task bodies that span more than a few lines live
# in .nu files under the matching folder.

[tools]
hcloud = "1.64.1"
vultr-cli = "3.10.0"
# aws-cli — only used for the Cloudflare R2 snapshot-transit pipeline
# (Phase 3): presigning URLs on the Mac, streaming the qcow2 to R2 on the
# BM. Unused on Hetzner-only workflows.
aws = "2.30.4"
fnox = "1.19.0"
# Nushell — all task bodies live in .nu files. Cross-platform binary,
# `git clone && mise install` works on Linux servers the same as on Mac.
"aqua:nushell/nushell" = "0.112.2"
# pitchfork — process manager for the embedded gui (gui:serve:bg keeps
# http-nu running across shell sessions). Only needed if you use the gui.
pitchfork = "latest"
# http-nu + xs — gui's HTTP server and event store. Installed from forks
# under joeblew999/* (relay-url branch) that add iroh-relay support for
# file system sync. Upstream cablehead/* doesn't yet ship release binaries.
"github:joeblew999/http-nu" = "0.16.0-relay-url.2"
"github:joeblew999/xs" = "0.12.0-relay-url.2"
# yoke — single LLM agent turn as a unix pipe (cablehead, same ecosystem as
# http-nu + xs). Powers ai:ask. JSONL in/out; --tools nu gives the LLM an
# embedded nushell engine with access to lifecycle scripts and state.
"github:cablehead/yoke" = "0.4.1"

[env]
# Which cloud the VM lives in. Default Hetzner (cpx42 TCG, slow but cheap).
# Override in mise.local.toml to switch:
#   VM_PROVIDER = "vultr"
# Accepted: "hetzner" | "vultr".
VM_PROVIDER = "hetzner"

# Hetzner-side. Used when VM_PROVIDER=hetzner.
SERVER_NAME = "windows-vm"
SERVER_TYPE = "cpx42"
SERVER_IMAGE = "ubuntu-24.04"
SERVER_LOCATION = "fsn1"
SSH_KEY = "gedw99_hetzner"
SSH_KEY_FILE = "~/.ssh/gedw99_hetzner"

# Vultr-side. Set in mise.local.toml when VM_PROVIDER=vultr. Empty here so
# this file commits cleanly; tasks error with clear pointers when missing.
# See `mise run vultr:setup` for the enumeration helpers.
VULTR_REGION = ""
VULTR_PLAN = ""
VULTR_OS_ID = "1743"
VULTR_SSH_KEY_ID = ""
VULTR_LABEL = "windows-vm"

# Cloudflare R2 — snapshot transit bucket (Phase 3). Provider-neutral;
# both Vultr's `snapshot create-url` and a future Hetzner cross-provider
# import path pull from here. Bootstrap once via `mise run r2:bootstrap`.
R2_ENDPOINT = ""
R2_BUCKET = ""

# Embedded gui (gui/*). Set in mise.local.toml to point at a sibling
# vm-software clone (for installs.jsonl) and pick a listen address.
VM_SOFTWARE_REPO = ""
HTTP_NU_ADDR = "127.0.0.1:8080"
REFRESH_INTERVAL_SEC = "10"

# xs event store — shared event bus between GUI (human actor) and MCP (AI actor).
# XS_ADDR: address xs clients connect to. TCP [HOST]:PORT or Unix socket PATH.
# XS_STORE: path where xs persists the event stream (committed alongside vms.jsonl).
# Override XS_ADDR in mise.local.toml to an iroh relay URL for multi-machine sync;
# the joeblew999/xs fork adds relay support so all clones converge automatically.
XS_ADDR  = "127.0.0.1:2619"
XS_STORE = "{{config_root}}/state/xs.store"

# ╔═════════════════════════════════════════════════════════════════════════╗
# ║ DAILY USE — these four cover 99% of work. Everything below is granular. ║
# ╚═════════════════════════════════════════════════════════════════════════╝

[tasks.start]
description = "RESUME WORK. Provisions a VM (from latest snapshot if any, else fresh), waits for Windows to be RDP-ready, opens RDP. Hetzner: ~90s from snapshot, ~1hr fresh. Vultr: ~6 min fresh on KVM (requires R2 bootstrap for the snapshot path)."
run = "nu lifecycle/start.nu"

[tasks.stop]
description = "END WORK. Clean-shuts Windows (ACPI via `docker stop --timeout=120`), snapshots (Hetzner: native ~60s; Vultr: dd → R2 → snapshot create-url, ~30-60 min), prunes older snapshots, destroys VM. ABORTS if any step fails — state is never destroyed without first being saved."
run = "nu lifecycle/stop.nu"

[tasks.push]
description = "Send a local file/dir TO the VM. Usage: `mise run push -- <path>`. Appears in Windows at \\\\host.lan\\Data\\<basename>."
run = "nu files/push.nu"

[tasks.pull]
description = "Get a file/dir FROM the VM. Usage: `mise run pull -- <name>` (relative to /root/windows_shared on the VM, same as \\\\host.lan\\Data\\<name>)."
run = "nu files/pull.nu"

# ── costs ─────────────────────────────────────────────────────────────────
[tasks."costs:show"]
description = "Print state/costs.jsonl as a table. Queryable provider/SKU pricing — use to decide which provider + SKU fits your usage pattern."
shell = "nu --commands"
run = "open state/costs.jsonl | lines | each {|l| $l | from json } | table -e"

# ── state ─────────────────────────────────────────────────────────────────
[tasks."state:show"]
description = "Show vm lifecycle events from state/vms.jsonl (provisioned / destroyed / snapshotted). The embedded gui (gui:* tasks) joins this with vm-software's installs.jsonl."
run = "nu state/show.nu"

[tasks."runs:show"]
description = "Derived view: one row per VM run (provisioned → destroyed). Derives from state/vms.jsonl; never writes."
run = "nu state/runs.nu"

[tasks."runs:export"]
description = "Same as runs:show but emits JSONL — pipe into other tools or `jq` for cost/duration analysis."
run = "nu state/runs.nu --json"

# ── gui (browser-side control plane, gui/*) ───────────────────────────────
# All daemons are defined in pitchfork.toml. These mise tasks are thin
# wrappers so users get a familiar `mise run ...` UX.

[tasks."up"]
description = "Bring the system up: pitchfork starts xs + gui. Open http://127.0.0.1:8080."
run = "pitchfork start xs gui"
dir = "{{config_root}}"

[tasks."down"]
description = "Take the system down: pitchfork stops xs + gui."
run = "pitchfork stop xs gui"
dir = "{{config_root}}"

[tasks."jobs"]
description = "Show what pitchfork is supervising right now (gui, xs, plus any per-action vm-action-* daemons spawned by the gui Start/Stop/Snapshot buttons)."
run = "pitchfork list"

# Interactive variants — block the shell, useful for dev / debugging the
# serve script. Stop with Ctrl-C. For background, use `mise run up`.
[tasks."gui:serve"]
description = "Run the gui in the foreground (interactive). --watch hot-reloads on serve.nu changes so the running system evolves as you edit. For background use `mise run up`."
run = "http-nu --datastar --watch $HTTP_NU_ADDR gui/server/serve.nu"

[tasks."xs:serve"]
description = "Run xs in the foreground (interactive). For background use `mise run up`."
run = "xs serve $XS_STORE --expose $XS_ADDR"
dir = "{{config_root}}"

[tasks."mcp:serve"]
description = "Nushell MCP server (stdio). Exposes a full nushell REPL so Claude Desktop / Claude Code can drive mise tasks directly. Long-running ops (snapshot, rdp:wait) auto-promote to background jobs."
run = "nu --mcp --config mcp/init.nu"
dir = "{{config_root}}"

[tasks."ai:ask"]
description = "Ask the AI about your VM in natural language. One-shot; streams live to stdout. Usage: mise run ai:ask -- 'is my VM running?'. Requires ANTHROPIC_API_KEY in keychain. Save a session: pipe to tee { save -f sessions/foo.jsonl }; replay: cat sessions/foo.jsonl | mise run ai:ask -- 'follow-up'."
run = "fnox exec --if-missing ignore -- yoke --provider anthropic --model claude-sonnet-4-5 --tools nu,read_file --config mcp/init.nu"
dir = "{{config_root}}"

[tasks."gui:state:aggregate"]
description = "Print the joined VMs + installs state as a table (CLI version of the gui's status board)."
run = "nu gui/state/aggregate.nu"

[tasks."gui:state:refresh"]
description = "git pull on the sibling vm-software repo. vm-servers's own state/vms.jsonl is local — no pull needed."
run = "nu gui/state/refresh.nu"

# ── ci (repo health — exactly what GH Actions runs) ───────────────────────
# Isomorphic: `mise run ci` locally produces the same result as the
# .github/workflows/check.yml run on a push. The workflow is a thin
# wrapper that does `mise install && mise run ci`.

[tasks."ci"]
description = "Run the full CI suite locally (syntax + schema + dispatcher smoke). Same scripts run in GH Actions."
depends = ["ci:syntax", "ci:schema", "ci:dispatch"]

[tasks."ci:syntax"]
description = "Parse-check every .nu file via nushell's built-in nu-check."
run = "nu ci/syntax.nu"

[tasks."ci:schema"]
description = "Validate state/vms.jsonl against state/vms.schema.json (pure-nu structural check)."
run = "nu ci/schema.nu"

[tasks."ci:dispatch"]
description = "Smoke-test lifecycle/dispatch.nu's error paths (bad provider, missing action)."
run = "nu ci/dispatch.nu"

# ── deps + token ──────────────────────────────────────────────────────────
[tasks."deps:check"]
description = "Verify required CLIs are present and the active provider's API token is seeded in keychain. Dispatches on $VM_PROVIDER."
run = "nu deps/check.nu"

[tasks."token:set"]
description = "One-time: stash a Hetzner Cloud API token in macOS keychain via fnox. Generate at https://console.hetzner.cloud → project → Security → API tokens. For Vultr, use `mise run vultr:token:set`."
run = "nu providers/hetzner/token-set.nu"

# ── vm (provider-aware front doors) ───────────────────────────────────────
# Hetzner-specific implementations (vm:qemu-up, vm:kvm-up) are defined
# below. Vultr-specific tasks live under vultr:*. The vm:* switches route
# by $VM_PROVIDER into providers/{hetzner,vultr}/*.nu.

[tasks."vm:qemu-up"]
description = "[Hetzner] Provision with cloud-init/qemu.yaml (TCG / `KVM=N`). Required on Hetzner Cloud — no nested virt on any tier."
run = "nu providers/hetzner/up.nu"

[tasks."vm:kvm-up"]
description = "[Hetzner Dedicated only] Provision with cloud-init/kvm.yaml (passes --device=/dev/kvm). Fails on Hetzner Cloud. For Vultr Bare Metal use `mise run vm:up` with VM_PROVIDER=vultr."
run = "nu providers/hetzner/kvm-up.nu"

[tasks."vm:up"]
description = "Provision a fresh VM with the active provider. Hetzner → cloud-init/qemu.yaml (TCG). Vultr Bare Metal → cloud-init/kvm.yaml (KVM)."
run = "nu lifecycle/dispatch.nu up"

[tasks."vm:snap-up"]
description = "Provision from latest snapshot. Hetzner: native hcloud snapshot. Vultr: `bare-metal create --snapshot <id>` (requires R2-backed snapshot to exist)."
run = "nu lifecycle/dispatch.nu snap-up"

[tasks."vm:down"]
description = "Delete the VM. Both providers: snapshot first (via the `stop` task) to preserve state."
run = "nu lifecycle/dispatch.nu down"

[tasks."vm:status"]
description = "Describe the VM — IP, state, created-at. Non-zero exit if the VM doesn't exist."
run = "nu lifecycle/dispatch.nu status"

[tasks."vm:ip"]
description = "Print the VM's public IPv4. Dispatches on $VM_PROVIDER."
run = "nu lifecycle/dispatch.nu ip"

# ── r2 (Cloudflare R2 — snapshot transit bucket) ──────────────────────────
[tasks."r2:bootstrap"]
description = "Guided walkthrough to set up the CF R2 bucket + API token used by the snapshot pipeline (Vultr today, future cross-provider). One-time per account. Prints the values to paste into mise.local.toml + the fnox set commands."
run = "nu r2/bootstrap.nu"

[tasks."r2:check"]
description = "Probe PUT/GET/DELETE round-trip against the configured R2 bucket. Use after `r2:bootstrap` to confirm credentials work before running snapshot pipelines."
run = "nu r2/check.nu"

# ── vultr (provider-specific paths) ───────────────────────────────────────
[tasks."vultr:token:set"]
description = "One-time: stash a Vultr API key in macOS keychain via fnox. Generate at https://my.vultr.com → Account → API. Needs Read/Write; subnet-restrict to your home IP."
run = "nu providers/vultr/token-set.nu"

[tasks."vultr:up"]
description = "[Vultr] Provision a Bare Metal instance with cloud-init/kvm.yaml. Requires VULTR_REGION/PLAN/OS_ID/SSH_KEY_ID in mise.local.toml."
run = "nu providers/vultr/up.nu"

[tasks."vultr:down"]
description = "[Vultr] Destroy the BM matching VULTR_LABEL."
run = "nu providers/vultr/down.nu"

[tasks."vultr:status"]
description = "[Vultr] Describe the BM matching VULTR_LABEL."
run = "nu providers/vultr/status.nu"

[tasks."vultr:setup"]
description = "[Vultr] First-time setup wizard. Prints current VULTR_* selections and enumerates regions, BM plans (≥6c), SSH keys, and Ubuntu OS IDs. Run before your first `mise run start` with VM_PROVIDER=vultr."
run = "nu providers/vultr/setup.nu"

[tasks."vultr:regions:list"]
description = "[Vultr] List all Vultr regions. Use the ID for VULTR_REGION in mise.local.toml."
run = "nu providers/vultr/regions-list.nu"

[tasks."vultr:plans:list"]
description = "[Vultr] List Bare Metal plans with ≥6 cores (what dockur needs). Use the ID for VULTR_PLAN."
run = "nu providers/vultr/plans-list.nu"

[tasks."vultr:ssh:list"]
description = "[Vultr] List SSH keys uploaded to your Vultr account. Use the UUID for VULTR_SSH_KEY_ID."
run = "nu providers/vultr/ssh-list.nu"

[tasks."vultr:os:list"]
description = "[Vultr] List Ubuntu OS IDs available for fresh BM installs. Default 1743 = Ubuntu 24.04 x64."
run = "nu providers/vultr/os-list.nu"

# ── snapshot (provider-aware) ─────────────────────────────────────────────
[tasks."snapshot:create"]
description = "Snapshot the running VM. Hetzner: hot hcloud snapshot (caller clean-shuts Windows first). Vultr: dd|gzip|R2 upload → `vultr-cli snapshot create-url` → registers in Vultr's snapshot store."
run = "nu lifecycle/dispatch.nu snapshot-create"

[tasks."snapshot:list"]
description = "List snapshots in the active provider's store."
run = "nu lifecycle/dispatch.nu snapshot-list"

[tasks."snapshot:prune"]
description = """
Delete old snapshots, keep the N newest (default 1 — set via SNAPSHOTS_KEEP).

  mise run snapshot:prune                    → keeps newest 1
  SNAPSHOTS_KEEP=3 mise run snapshot:prune   → keeps newest 3
"""
run = "nu lifecycle/dispatch.nu snapshot-prune"

# ── rdp ───────────────────────────────────────────────────────────────────
[tasks."rdp:wait"]
description = "Block until port 3389 accepts TCP — Windows finished OOBE. Polls every 30s, 90 min max. macOS notification on success/timeout."
run = "nu connect/rdp-wait.nu"

[tasks."rdp:install"]
description = "Install Microsoft's macOS RDP client (`Windows App`) via Homebrew cask. One-time per machine. Idempotent."
run = "nu connect/rdp-install.nu"

[tasks."rdp:open"]
description = "Open RDP to the VM. Auto-installs the client on first run. dockur defaults: user `Docker`, password `admin`."
depends = ["rdp:install"]
run = "nu connect/rdp-open.nu"

# ── files (push/pull are at the top) ──────────────────────────────────────
[tasks."files:ls"]
description = "List the VM's shared folder. Same view Windows sees at \\\\host.lan\\Data."
run = "nu files/ls.nu"

# ── viewer ────────────────────────────────────────────────────────────────
# (software:* and trial:* moved to the sibling vm-software repo. To install
# things on a running VM: ssh in, `git clone https://github.com/joeblew999/
# vm-software && cd vm-software && mise install && mise run install:<app>`.)

[tasks."viewer:open"]
description = "Open dockur's web viewer (port 8006) in the default browser. Works as soon as dockur is up."
run = "nu connect/viewer-open.nu"

# ── debug ─────────────────────────────────────────────────────────────────
[tasks."debug:ssh"]
description = "Interactive SSH on the host Linux VM as root."
run = "nu debug/ssh.nu"

[tasks."debug:probe"]
description = "Quick health check: container state, mounts, restart policy, ports 22/3389/8006. Run first when something seems off."
run = "nu debug/probe.nu"

[tasks."debug:logs"]
description = "Tail the dockur container's stdout. Useful when Windows seems stuck mid-boot."
run = "nu debug/logs.nu"

[tasks."debug:metrics"]
description = "[Hetzner only] Print last-5-min Hetzner-side metrics: peak network, CPU avg/peak."
run = "nu debug/metrics.nu"

[tasks."debug:version"]
description = "Show dockur/windows version: pinned in cloud-init, running on live VM, latest released on GitHub."
run = "nu debug/version.nu"

[tasks."debug:host-disk"]
description = "Disk usage on the host VM — sees Windows qcow2 and shared folder."
run = "nu debug/host-disk.nu"

# ── Windows-side setup helper ─────────────────────────────────────────────

[tasks."win:ssh-setup"]
description = "Run this task ON THE WINDOWS MACHINE (as Admin) to configure OpenSSH and print Mac setup commands."
shell = "powershell -Command"
run = '''
$isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
if (-not $isAdmin) {
    Write-Error "ERROR: You MUST run this task in an Administrator command prompt or PowerShell window!"
    Exit 1
}

Write-Host "Checking OpenSSH Server status..."
$capability = Get-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
if ($capability.State -ne "Installed") {
    Write-Host "Installing OpenSSH Server (this may take a minute)..."
    Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
} else {
    Write-Host "OpenSSH Server is already installed."
}

Write-Host "Starting SSH service and setting to automatic..."
Start-Service sshd -ErrorAction SilentlyContinue
Set-Service -Name sshd -StartupType 'Automatic'

# Fetch primary local IP
$ip = Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike "127.*" -and $_.IPAddress -notlike "169.254.*" } | Select-Object -ExpandProperty IPAddress | Select-Object -First 1
$user = $env:USERNAME

Write-Host "`n==================================================" -ForegroundColor Green
Write-Host "SSH SETUP COMPLETED SUCCESSFULLY!" -ForegroundColor Green
Write-Host "==================================================" -ForegroundColor Green
Write-Host "Now run the following commands on your Mac terminal:"
Write-Host ""
Write-Host "export VM_PROVIDER=\"lan-windows\""
Write-Host "export LAN_SSH_HOST=\"$ip\""
Write-Host "export LAN_SSH_USER=\"$user\""
Write-Host "export LAN_WINDOWS_USER=\"$user\""
Write-Host "export LAN_SSH_PASS=\"(Your Windows Account Password)\""
Write-Host "=================================================="
'''
