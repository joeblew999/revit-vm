#cloud-config
# QEMU/TCG variant — runs on hosts WITHOUT /dev/kvm (e.g. Hetzner Cloud,
# any tier). Forces software emulation via `-e KVM=N`; ~10x slower than
# KVM-backed but works everywhere. Pair with `mise run vm:up` (default).
# Use `cloud-init-kvm.yaml` + `mise run vm:kvm-up` on KVM-capable hosts.
package_update: true
packages:
  - docker.io
  - docker-compose

runcmd:
  # Storage for the Windows VM image (dockur writes the .qcow2 here)
  - mkdir -p /root/windows_storage

  # Shared workspace: anything dropped here appears inside Windows as
  # \\host.lan\Data — moves files, job specs, installers, outputs across
  # the Mac↔Windows boundary without RDP click-through. cloud-init stays
  # minimal on purpose — Windows app installs are post-boot work driven
  # by the sibling vm-software repo (git-cloned inside the VM).
  - mkdir -p /root/windows_shared/installers
  - mkdir -p /root/windows_shared/jobs
  - mkdir -p /root/windows_shared/output

  # OEM hook (see oem/install.bat in the repo): dockur copies this folder
  # to C:\OEM inside the VM and runs install.bat as Admin during the final
  # step of the unattended Windows install — before any human logs in.
  # Only fires on a greenfield Windows install (vm:up). Snapshot restores
  # (vm:up-snap) skip it because the snapshot is already past that point.
  - mkdir -p /root/oem
  - >
    curl -sSL -o /root/oem/install.bat
    https://raw.githubusercontent.com/joeblew999/vm-servers/main/oem/install.bat

  # Run the dockur/windows container automatically.
  # KVM=N forces QEMU/TCG software emulation — Hetzner Cloud doesn't expose
  # nested virtualization on any server tier. Expect ~5-10x slower Windows
  # vs KVM-backed; viable for headless / unattended workloads, painful for
  # interactive use.
  - >
    docker run -d --name windows
    -p 8006:8006
    -p 3389:3389/tcp
    -p 3389:3389/udp
    --cap-add NET_ADMIN
    -e KVM=N
    -e RAM_SIZE="12G"
    -e CPU_CORES="6"
    -v /root/windows_storage:/storage
    -v /root/windows_shared:/data
    -v /root/oem:/oem
    --restart=always
    dockurr/windows:5.15
