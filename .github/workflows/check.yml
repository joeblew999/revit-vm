# Thin wrapper around `mise run ci`. Same scripts run locally — see
# ci/{syntax,schema,dispatch}.nu and the `mise run ci` umbrella in
# mise.toml. DRY: this workflow does NOT contain validation logic.
name: check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise + repo tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: mise run ci
        run: mise run ci
