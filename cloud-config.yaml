#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose

runcmd:
  # Create the shared storage directory
  - mkdir -p /root/windows_storage

  # Run the dockur/windows container automatically
  - >
    docker run -d --name windows_batch_processor
    -p 8006:8006
    -p 3389:3389/tcp
    -p 3389:3389/udp
    --device=/dev/kvm
    --cap-add NET_ADMIN
    -e RAM_SIZE="12G"
    -e CPU_CORES="6"
    -v /root/windows_storage:/storage
    --restart unless-stopped
    dockurr/windows
